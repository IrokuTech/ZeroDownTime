# Deployment de ZeroDownTime
# __IMAGEN__, __VERSION__ y __CAUSA__ se sustituyen antes de aplicarlo (a mano o desde Jenkins).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zerodowntime
  labels:
    app: zerodowntime
  annotations:
    kubernetes.io/change-cause: "__CAUSA__"   # aparece en "kubectl rollout history"
spec:
  replicas: 2                      # dos copias de la aplicación = alta disponibilidad
  revisionHistoryLimit: 5          # guarda versiones anteriores para poder volver atrás
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # durante una actualización nunca baja de 2 pods disponibles
      maxSurge: 1                  # crea un pod nuevo antes de eliminar uno antiguo
  selector:
    matchLabels:
      app: zerodowntime
  template:
    metadata:
      labels:
        app: zerodowntime
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: __IMAGEN__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME           # nombre del pod, se muestra en /pod e /info
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ENTORNO            # el namespace indica el entorno (pruebas / produccion)
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: APP_VERSION
              value: "__VERSION__"
          readinessProbe:              # el Service solo envía tráfico a pods preparados
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:               # si deja de responder, Kubernetes reinicia el contenedor
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          lifecycle:
            preStop:                   # espera a que el Service deje de enviarle tráfico
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi