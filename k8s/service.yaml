# Service de ZeroDownTime: reparte las peticiones entre las réplicas.
# Tipo NodePort: en Minikube no hay balanceador de AWS; el Service expone
# un puerto fijo en el nodo y kube-proxy reparte el tráfico entre los pods.
# __NODEPORT__ se sustituye antes de aplicarlo (produccion: 30080, pruebas: 30081).
apiVersion: v1
kind: Service
metadata:
  name: zerodowntime
  labels:
    app: zerodowntime
spec:
  type: NodePort
  selector:
    app: zerodowntime
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: __NODEPORT__