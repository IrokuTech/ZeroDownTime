# Nginx como proxy inverso hacia los Services de Kubernetes (Minikube).
# Se instala en la EC2 en /etc/nginx/sites-available/zerodowntime.
#
#   Navegador -> :80   -> Nginx -> 192.168.49.2:30080 -> Service -> 2 pods (produccion)
#   Navegador -> :8081 -> Nginx -> 192.168.49.2:30081 -> Service -> 2 pods (pruebas)
#
# 192.168.49.2 es la IP del nodo de Minikube (comando: minikube ip).
# Nginx abre una conexion nueva con el Service en cada peticion, por lo que
# el reparto entre pods lo sigue haciendo Kubernetes.

upstream zdt_produccion {
    server 192.168.49.2:30080;
}

upstream zdt_pruebas {
    server 192.168.49.2:30081;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://zdt_produccion;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}

server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://zdt_pruebas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
