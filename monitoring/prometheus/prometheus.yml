global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    proyecto: zerodowntime

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # El propio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Node Exporter de la EC2, accesible solo a traves del tunel SSH
  - job_name: node-ec2
    static_configs:
      - targets: ["tunel-ec2:9100"]
        labels:
          servidor: ZeroDownTime-DevOps-EC2
    relabel_configs:
      # Nombre legible de la instancia en lugar de host:puerto del tunel
      - target_label: instance
        replacement: ec2-zerodowntime

  # Comprobacion HTTP de /health de la aplicacion en ambos entornos (blackbox_exporter)
  - job_name: app-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://tunel-ec2:30080/health"]
        labels:
          entorno: produccion
      - targets: ["http://tunel-ec2:30081/health"]
        labels:
          entorno: pruebas
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
