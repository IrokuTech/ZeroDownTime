# Stack de monitorizacion local (WSL2 + Docker Desktop) para la EC2 de ZeroDownTime.
# Uso: cd monitoring && docker compose up -d

name: zerodowntime-monitoring

services:

  # Tunel SSH hacia la EC2. Equivale a: ssh -N -L 9100:localhost:9100 ubuntu@16.16.34.178
  # Node Exporter escucha solo en 127.0.0.1:9100 de la EC2, asi que no se abre el
  # puerto 9100 en el Security Group. Tambien reenvia los NodePort de la app
  # (Minikube, 192.168.49.2) para las sondas de blackbox_exporter.
  tunel-ec2:
    build: ./tunel
    container_name: tunel-ec2
    restart: unless-stopped
    environment:
      EC2_HOST: ${EC2_HOST}
      EC2_USER: ${EC2_USER}
      MINIKUBE_IP: ${MINIKUBE_IP}
    volumes:
      - ${EC2_KEY_PATH}:/ssh/ec2.pem:ro
      - ${KNOWN_HOSTS_PATH}:/ssh/known_hosts:ro
    expose:
      - "9100"
      - "30080"
      - "30081"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - tunel-ec2
      - blackbox
      - alertmanager

  # Notificaciones a Discord. La URL del webhook es secreta: se lee del fichero
  # alertmanager/.env.discord, excluido de git (ver alertmanager/env.discord.example).
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      TZ: Europe/Madrid
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/.env.discord:/etc/alertmanager/discord_webhook_url:ro
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - alertmanager-data:/alertmanager

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    container_name: blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    expose:
      - "9115"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DEFAULT_TIMEZONE: Europe/Madrid
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
